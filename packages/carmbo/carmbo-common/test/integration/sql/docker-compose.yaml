services:
  migration-test-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - 5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d postgres']
      interval: 1s
      timeout: 5s
      retries: 30
