name: carmbo-pages-community

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: carmbo_community
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d carmbo_community']
      interval: 1s
      timeout: 5s
      retries: 30
