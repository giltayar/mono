allowBuilds:
  '@railway/cli': true
  '@firebase/util': false
  '@swc/core': false
  protobufjs: false
  es5-ext: false
  # The email package ships its browser bundle; the app does not run esbuild.
  esbuild: false

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@giltayar/*'
  - '@typescript/*'

updateConfig:
  ignoreDependencies:
    - postgres
