services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: carmbo_student
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d carmbo_student']
      interval: 1s
      timeout: 5s
      retries: 30
