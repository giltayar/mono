services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: monnaie
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - 5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d monnaie']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  monnaie-app:
    image: giltayar/monnaie-app:${MONNAIE_APP_VERSION}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_CONNECTION_STRING: postgres://user:password@postgres:5432/monnaie
      MONNAIE_FIREBASE_SERVICE_ACCOUNT_JSON: ${MONNAIE_FIREBASE_SERVICE_ACCOUNT_JSON}
      MONNAIE_FIREBASE_API_KEY: ${MONNAIE_FIREBASE_API_KEY}
      # the tests reach the container over plain http, which a `Secure` cookie would never reach
      SECURE_COOKIES: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000
