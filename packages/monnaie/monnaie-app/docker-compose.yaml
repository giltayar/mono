services:
  postgres:
    image: postgres:17
    container_name: monnaie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: monnaie
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - ${HOME}/.monnaie-app/.db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d monnaie']
      interval: 10s
      timeout: 5s
      retries: 5
